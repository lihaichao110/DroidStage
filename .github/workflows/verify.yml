name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  android-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - run: bash ./gradlew assembleDebug assembleDebugAndroidTest
        working-directory: android
      - run: npm run stage:agent
      - uses: actions/upload-artifact@v4
        with:
          name: android-agent-apks
          path: |
            assets/agent/host.apk
            assets/agent/test.apk
